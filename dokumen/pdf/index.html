<!DOCTYPE html>
<html lang="id">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport"
		      content="width=device-width, initial-scale=1"
		>
		<meta name="theme-color"
		      content="#141218"
		>
		<meta name="robots"
		      content="noindex, nofollow"
		>
		<title>Pratinjau Dokumen — Zhyllan Fyllah</title>
		<link rel="icon"
		      type="image/png"
		      href="https://cdn.zhyllanfyllah.my.id/cdn/privite/assets/portofolio/favicon.png"
		>
		<link rel="preconnect"
		      href="https://fonts.gstatic.com"
		      crossorigin
		>
		<link rel="preconnect"
		      href="https://cdn.zhyllanfyllah.my.id"
		      crossorigin
		>
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
		      rel="stylesheet"
		>
		<link rel="stylesheet"
		      href="https://cdn.zhyllanfyllah.my.id/cdn/public/css/materialZ/1.0.0.css"
		>
		<link rel="stylesheet"
		      href="https://cdn.zhyllanfyllah.my.id/cdn/privite/css/document/1.0.1.css"
		>
	</head>
	<body class="pdf-body">
		<main class="pdf-app">
			<header class="pdf-toolbar">
				<a class="pdf-icon-button" id="close-viewer" href="/dokumen/" aria-label="Kembali ke daftar dokumen" title="Kembali">
					<span class="material-icons-round" aria-hidden="true">arrow_back</span>
				</a>
				<div class="pdf-heading">
					<strong id="pdf-title">Pratinjau dokumen</strong>
					<span id="pdf-status" role="status" aria-live="polite">Memuat dokumen…</span>
				</div>
				<div class="pdf-actions">
					<a class="pdf-action" id="pdf-open" href="#" target="_blank" rel="noopener" aria-disabled="true" aria-label="Buka dokumen di tab baru" title="Buka">
						<span class="material-icons-round" aria-hidden="true">open_in_new</span>
						<span>Buka</span>
					</a>
					<button class="pdf-action pdf-action-primary" id="pdf-download" type="button" disabled aria-label="Unduh dokumen" title="Unduh">
						<span class="material-icons-round" aria-hidden="true">download</span>
						<span>Unduh</span>
					</button>
				</div>
			</header>

			<section class="pdf-stage" aria-label="Pratinjau dokumen">
				<div class="pdf-loader" id="pdf-loader">
					<span class="pdf-spinner" aria-hidden="true"></span>
					<p>Memuat dokumen…</p>
					<p class="pdf-loader-hint">Halaman dirender langsung di perangkat ini.</p>
				</div>

				<div class="pdf-scroll" id="pdf-scroll" hidden></div>

				<div class="pdf-error" id="pdf-error" hidden>
					<span class="material-icons-round pdf-error-icon" aria-hidden="true">error_outline</span>
					<strong>Dokumen tidak dapat dibuka</strong>
					<p id="pdf-error-text">Berkas tidak ditemukan atau sumbernya tidak diizinkan.</p>
					<div class="pdf-error-actions">
						<button class="pdf-action" id="pdf-retry" type="button">Coba lagi</button>
						<a class="pdf-action" id="pdf-error-open" href="#" target="_blank" rel="noopener">Buka di tab baru</a>
						<button class="pdf-action pdf-action-primary" id="pdf-error-download" type="button">Unduh</button>
					</div>
				</div>
			</section>
		</main>

		<script src="https://cdn.zhyllanfyllah.my.id/cdn/privite/js/document/viewer/1.0.0.js" defer></script>
	</body>
</html>
